name: Printlight
options:
  bundleIdPrefix: com.declanjavers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Printlight:
    type: application
    platform: iOS
    sources:
      - Printlight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.declanjavers.printlight
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set your team here or in Xcode > Signing & Capabilities.
        DEVELOPMENT_TEAM: 56M2NM3C49
        # Core Image kernels written in Metal need these two flags.
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -fcikernel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Printlight
        INFOPLIST_KEY_NSCameraUsageDescription: Printlight uses the camera to take RAW photos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Printlight saves your developed photos and their RAW negatives to your library.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Printlight saves your shots to Photos and shows them in its Library so you can re-develop them.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
